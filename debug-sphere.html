<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seraphonix DEBUG MODE</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="mobile-responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        #debug-console {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 400px;
            max-height: 300px;
            background: rgba(0,0,0,0.9);
            border: 2px solid #0f0;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 10px;
            overflow-y: auto;
            z-index: 99999;
        }
        #debug-console .error { color: #f00; }
        #debug-console .info { color: #0ff; }
        #debug-console .success { color: #0f0; }
    </style>
</head>
<body>
    <div id="debug-console">
        <div><strong>DEBUG CONSOLE</strong></div>
        <div id="debug-output"></div>
    </div>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader-container">
            <div class="loader-sphere">
                <div class="ring ring-1"></div>
                <div class="ring ring-2"></div>
                <div class="ring ring-3"></div>
            </div>
            <div class="loader-text">
                <span class="glitch" data-text="AWAKENING THE SERAPH">AWAKENING THE SERAPH</span>
                <span class="dots">...</span>
            </div>
            <div class="loader-sigil">◉</div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <div class="loader-status">Igniting the six wings of creation...</div>
        </div>
    </div>

    <!-- Main Interface -->
    <div id="interface">
        <div class="hud-overlay">
            <div class="hud-top">
                <div class="hud-left">
                    <div class="logo-small">
                        <span class="logo-icon">◉</span>
                        <span>SERAPHONIX</span>
                    </div>
                </div>
                <div class="hud-center">
                    <div class="system-status">
                        <span class="status-indicator online"></span>
                        <span>SERAPH AWAKENED • SIX WINGS ACTIVE</span>
                    </div>
                </div>
                <div class="hud-right">
                    <button id="admin-btn" class="admin-trigger">
                        <span class="admin-icon">🔐</span>
                        <span>ADMIN</span>
                    </button>
                    <div class="time-display" id="clock">00:00:00</div>
                </div>
            </div>
            
            <div class="hud-controls">
                <div class="control-group">
                    <label>ROTATION SPEED</label>
                    <input type="range" id="speed-slider" min="0" max="100" value="15">
                </div>
                <div class="control-group">
                    <label>ZOOM</label>
                    <input type="range" id="zoom-slider" min="50" max="150" value="100">
                </div>
                <button id="reset-view" class="hud-btn">RESET VIEW</button>
            </div>
            
            <div class="hud-bottom">
                <div class="coordinates">
                    <div class="coord">
                        <span class="coord-label">X</span>
                        <span class="coord-value" id="coord-x">0.00</span>
                    </div>
                    <div class="coord">
                        <span class="coord-label">Y</span>
                        <span class="coord-value" id="coord-y">0.00</span>
                    </div>
                    <div class="coord">
                        <span class="coord-label">Z</span>
                        <span class="coord-value" id="coord-z">0.00</span>
                    </div>
                </div>
                <div class="instructions">
                    <span>🖱️ GRASP THE SERAPH</span>
                    <span>👆 TOUCH THE LIGHT</span>
                    <span>⚡ DOUBLE CLICK TO RESURRECT</span>
                </div>
            </div>
        </div>

        <div id="node-labels"></div>
        <canvas id="sphere-canvas"></canvas>
    </div>

    <script>
        // Debug logger
        const debugOutput = document.getElementById('debug-output');
        function debug(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = type;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            debugOutput.appendChild(div);
            console.log(msg);
        }

        // Override console methods
        const originalLog = console.log;
        const originalError = console.error;
        console.log = function(...args) {
            debug(args.join(' '), 'success');
            originalLog.apply(console, args);
        };
        console.error = function(...args) {
            debug('ERROR: ' + args.join(' '), 'error');
            originalError.apply(console, args);
        };

        debug('Debug mode initialized');
        debug('Testing THREE.js...');
        
        if (typeof THREE === 'undefined') {
            debug('THREE.js NOT LOADED!', 'error');
        } else {
            debug('THREE.js loaded: ' + THREE.REVISION, 'success');
        }

        debug('Testing GSAP...');
        if (typeof gsap === 'undefined') {
            debug('GSAP NOT LOADED!', 'error');
        } else {
            debug('GSAP loaded', 'success');
        }

        debug('Testing canvas...');
        const canvas = document.getElementById('sphere-canvas');
        if (!canvas) {
            debug('Canvas NOT FOUND!', 'error');
        } else {
            debug('Canvas found', 'success');
        }

        // Minimal sphere test
        try {
            debug('Creating minimal test scene...');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050508);
            
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 12;
            
            const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x050508);
            
            // Create a simple sphere
            const geometry = new THREE.IcosahedronGeometry(4, 2);
            const material = new THREE.MeshBasicMaterial({ 
                color: 0x00D4FF, 
                wireframe: true,
                transparent: true,
                opacity: 0.3
            });
            const sphere = new THREE.Mesh(geometry, material);
            scene.add(sphere);
            
            // Add a central node
            const nodeGeo = new THREE.SphereGeometry(1.2, 32, 32);
            const nodeMat = new THREE.MeshPhongMaterial({ 
                color: 0x00D4FF,
                emissive: 0x00D4FF,
                emissiveIntensity: 0.4
            });
            const node = new THREE.Mesh(nodeGeo, nodeMat);
            scene.add(node);
            
            // Animation loop
            function animate() {
                requestAnimationFrame(animate);
                sphere.rotation.y += 0.002;
                sphere.rotation.x += 0.001;
                node.rotation.y += 0.005;
                renderer.render(scene, camera);
            }
            animate();
            
            debug('Minimal sphere rendering!', 'success');
            
            // Hide loading screen
            setTimeout(() => {
                const loading = document.getElementById('loading-screen');
                if (loading) {
                    loading.classList.add('hidden');
                    debug('Loading screen hidden', 'success');
                }
            }, 2000);
            
        } catch (error) {
            debug('FATAL: ' + error.message, 'error');
            console.error(error);
        }
    </script>
</body>
</html>
