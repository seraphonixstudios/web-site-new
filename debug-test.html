<!DOCTYPE html>
<html>
<head>
    <title>Debug Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: monospace; }
        #debug { padding: 20px; }
        .ok { color: #0f0; }
        .error { color: #f00; }
    </style>
</head>
<body>
    <div id="debug">
        <h2>Debug Console</h2>
        <div id="output"></div>
    </div>
    <canvas id="test-canvas" style="width:100%;height:300px;"></canvas>

    <script>
        const output = document.getElementById('output');
        function log(msg, isError = false) {
            const div = document.createElement('div');
            div.className = isError ? 'error' : 'ok';
            div.textContent = (isError ? '✗ ' : '✓ ') + msg;
            output.appendChild(div);
            console.log(msg);
        }

        try {
            log('Script started');
            
            // Test 1: THREE.js
            if (typeof THREE !== 'undefined') {
                log('THREE.js loaded: ' + THREE.REVISION);
            } else {
                log('THREE.js NOT loaded', true);
            }
            
            // Test 2: GSAP
            if (typeof gsap !== 'undefined') {
                log('GSAP loaded');
            } else {
                log('GSAP NOT loaded', true);
            }
            
            // Test 3: Canvas
            const canvas = document.getElementById('test-canvas');
            if (canvas) {
                log('Canvas found');
            } else {
                log('Canvas NOT found', true);
            }
            
            // Test 4: WebGL
            try {
                const renderer = new THREE.WebGLRenderer({ canvas: canvas });
                log('WebGL working');
                
                // Test 5: Basic scene
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, 2, 0.1, 1000);
                const geometry = new THREE.BoxGeometry();
                const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
                const cube = new THREE.Mesh(geometry, material);
                scene.add(cube);
                camera.position.z = 5;
                
                function animate() {
                    requestAnimationFrame(animate);
                    cube.rotation.x += 0.01;
                    cube.rotation.y += 0.01;
                    renderer.render(scene, camera);
                }
                animate();
                log('Animation started - cube spinning');
                
            } catch (e) {
                log('WebGL error: ' + e.message, true);
            }
            
            log('All tests passed!');
            
        } catch (error) {
            log('FATAL ERROR: ' + error.message, true);
            console.error(error);
        }
    </script>
</body>
</html>
