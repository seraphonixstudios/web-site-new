<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis AI - Image Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0f; 
            color: #fff; 
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { 
            color: #00D4FF; 
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0,212,255,0.5);
        }
        .prompt-box {
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 15px;
            background: rgba(0,212,255,0.1);
            border: 1px solid #00D4FF;
            color: #fff;
            font-size: 1.1rem;
            border-radius: 8px;
            outline: none;
        }
        input:focus {
            box-shadow: 0 0 20px rgba(0,212,255,0.3);
        }
        button {
            padding: 15px 30px;
            background: linear-gradient(90deg, #00D4FF, #7000FF);
            border: none;
            color: #fff;
            font-size: 1rem;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            border-radius: 8px;
            margin-top: 10px;
        }
        button:hover {
            box-shadow: 0 0 30px rgba(0,212,255,0.5);
        }
        #result {
            margin-top: 30px;
            max-width: 100%;
        }
        #result img {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0,212,255,0.3);
        }
        .loading {
            color: #00D4FF;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <h1>GENESIS AI</h1>
    <div class="prompt-box">
        <input type="text" id="prompt" placeholder="Enter your prompt..." autocomplete="off">
    </div>
    <button onclick="generate()">GENERATE</button>
    <div id="result"></div>
    
    <script>
        async function generate() {
            const prompt = document.getElementById('prompt').value;
            if (!prompt) return alert('Please enter a prompt');
            
            const result = document.getElementById('result');
            result.innerHTML = '<div class="loading">Generating...</div>';
            
            try {
                const res = await fetch('/genesis/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, width: 1024, height: 1024 })
                });
                const data = await res.json();
                
                if (data.success) {
                    result.innerHTML = '<img src="' + data.url + '" alt="Generated">';
                } else {
                    result.innerHTML = '<div style="color:red">Error: ' + data.error + '</div>';
                }
            } catch(e) {
                result.innerHTML = '<div style="color:red">Error: ' + e.message + '</div>';
            }
        }
    </script>
</body>
</html>
