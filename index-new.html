<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Seraphonix Studios</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;color:#e0e0e0;font-family:Arial,sans-serif;min-height:100vh}
#loading{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,#0a0a15 0%,#050508 100%);z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
#loading.hidden{opacity:0;pointer-events:none}
.logo{font-size:4rem;color:#00f3ff;text-shadow:0 0 30px rgba(0,243,255,.5);animation:pulse 2s infinite;margin-bottom:20px}
.title{font-size:1.5rem;color:#00f3ff;letter-spacing:4px;margin-bottom:10px;font-weight:bold}
.subtitle{color:#ff00ff;font-size:.9rem;letter-spacing:2px}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(1.05)}}
#main{display:none;padding:40px 20px;max-width:600px;margin:0 auto;text-align:center}
#main.active{display:block}
h1{color:#00f3ff;margin-bottom:10px}
.nodes{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:30px}
.node{background:rgba(0,0,0,.5);border:2px solid;padding:25px 15px;text-align:center;cursor:pointer;transition:all .3s;text-decoration:none;display:block;color:inherit}
.node:hover{transform:scale(1.05);box-shadow:0 0 20px currentColor}
.node-cyan{border-color:#00f3ff;color:#00f3ff}
.node-pink{border-color:#ff006e;color:#ff006e}
.node-gold{border-color:#ffb800;color:#ffb800}
.node-red{border-color:#ff0040;color:#ff0040}
.icon{font-size:2rem;margin-bottom:10px;display:block}
.name{font-size:.85rem;font-weight:700}
.cta{display:block;background:linear-gradient(135deg,rgba(0,243,255,.2),rgba(157,0,255,.2));border:2px solid #00f3ff;color:#00f3ff;padding:20px;text-align:center;text-decoration:none;margin-top:20px;font-weight:bold}
@media(max-width:480px){.logo{font-size:3rem}.nodes{gap:10px}.node{padding:20px 10px}}
</style>
</head>
<body>
<div id="loading">
<div class="logo">◉</div>
<div class="title">AWAKENING THE SERAPH</div>
<div class="subtitle">Neural Sphere Interface</div>
</div>
<div id="main">
<div class="logo" style="animation:none">◉</div>
<h1>SERAPHONIX</h1>
<p style="color:#ff00ff;margin-bottom:10px">Neural Sphere Interface</p>
<p style="color:#8899a6;margin-bottom:30px">Tap a node to explore</p>
<div class="nodes">
<a href="http://76.13.242.128:3077/" class="node node-cyan">
<span class="icon">◉</span>
<span class="name">NEURAL-OS</span>
</a>
<a href="/store_html/store.html" class="node node-pink">
<span class="icon">🛒</span>
<span class="name">STORE</span>
</a>
<a href="/simple.html" class="node node-gold">
<span class="icon">📖</span>
<span class="name">SIMPLE</span>
</a>
<a href="/test.html" class="node node-red">
<span class="icon">🔧</span>
<span class="name">TEST</span>
</a>
</div>
<a href="http://76.13.242.128:3077/" class="cta">🔐 ACCESS CMO TERMINAL</a>
</div>
<script>
setTimeout(function(){
var l=document.getElementById('loading');
var m=document.getElementById('main');
if(l)l.classList.add('hidden');
if(m)m.classList.add('active');
},2000);
</script>
</body>
</html>
