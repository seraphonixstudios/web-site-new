server {
    listen 80 default_server;
    server_name verilysovereign.org www.verilysovereign.org;
    root /var/www/html;
    index index.html;

    # Main website
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Store
    location /store_html {
        alias /var/www/html/store_html;
        try_files $uri $uri/ =404;
    }

    # AI Image Generator
    location /AI_Image_Generator {
        alias /var/www/html/AI_Image_Generator;
        try_files $uri $uri/ =404;
    }

    # Branding assets
    location /branding {
        alias /var/www/html/branding;
    }

    # Security headers - PERMISSIVE CSP for external resources
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; script-src * 'unsafe-inline' 'unsafe-eval'; style-src * 'unsafe-inline' fonts.googleapis.com; font-src * fonts.gstatic.com data:; connect-src *; img-src * data: blob:; frame-src *;" always;
    
    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
